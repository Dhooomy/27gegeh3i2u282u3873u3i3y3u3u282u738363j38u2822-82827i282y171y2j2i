<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ضربة معلّم</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&display=swap">
<style>
:root{--bg:#120c18;--panel:#20152a;--gold:#f5c451;--gold2:#b8860b;--tx:#fff4dc;--mut:#b9a98c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120c18;--panel:#20152a;--tx:#fff4dc}}
:root[data-theme="dark"]{--bg:#120c18;--panel:#20152a;--tx:#fff4dc}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:Tajawal,system-ui,"Segoe UI",Tahoma,sans-serif;overflow:hidden;touch-action:none}
#c2,#c3{position:absolute;inset:0;width:100%;height:100%;display:block}
#c3 canvas{width:100%;height:100%;display:block}
#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;gap:6px;z-index:5;pointer-events:none}
#hud[hidden],#bar[hidden],#tb[hidden]{display:none}
.pill{pointer-events:auto;background:linear-gradient(#2d1e3c,#1a1024);border:1.5px solid var(--gold2);border-radius:999px;padding:6px 13px;font:800 17px Tajawal,sans-serif;color:var(--gold);box-shadow:0 4px 14px #0008}
#bar{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:0;right:0;display:flex;gap:6px;justify-content:center;z-index:5;padding:0 6px}
.wb{background:linear-gradient(#2d1e3c,#1a1024);border:1.5px solid #4a3a5a;color:var(--tx);border-radius:13px;padding:5px 4px;font:800 11px Tajawal,sans-serif;width:56px;text-align:center;line-height:1.25}
.wb canvas{display:block;margin:0 auto 1px}.wb small{color:var(--gold);font-size:10px}
.wb.on{border-color:var(--gold);box-shadow:0 0 14px #f5c45199;transform:translateY(-5px)}
.wb.lk canvas{opacity:.3}
.ov{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;background:radial-gradient(circle at 50% 30%,#3a2552,#120c18 70%);overflow:auto}
.ov.show{display:flex}
h1{margin:0;font-size:44px;background:linear-gradient(#fff2b8,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 6px #000a)}
.sub{color:var(--mut);margin:0 0 8px;text-align:center}
.btn{width:min(86vw,340px);padding:15px;border-radius:16px;border:2px solid var(--gold);background:linear-gradient(#f9d977,#c99a21);color:#2a1a00;font:800 20px Tajawal,sans-serif;box-shadow:0 6px 0 #7a5a0c,0 10px 20px #0008}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #7a5a0c}
.btn:disabled{opacity:.5}
.btn.alt{background:linear-gradient(#3a2a4a,#231630);color:var(--gold);box-shadow:0 6px 0 #0007}
.card{width:min(92vw,380px);display:flex;align-items:center;gap:12px;background:var(--panel);border:1.5px solid #4a3a5a;border-radius:14px;padding:8px 14px}
.card div{flex:1}.card small{color:var(--mut)}
.card button{border:0;border-radius:10px;padding:9px 12px;background:var(--gold);font:800 14px Tajawal,sans-serif;color:#2a1a00}
.card button:disabled{opacity:.4}
#bubble{position:absolute;z-index:6;max-width:210px;background:#fff8e6;color:#2a1a00;padding:8px 12px;border-radius:14px;font-weight:800;font-size:15px;text-align:center;transform:translate(-50%,-100%);display:none;box-shadow:0 4px 12px #0008;pointer-events:none}
#bubble:after{content:"";position:absolute;bottom:-9px;left:50%;margin-left:-8px;border:8px solid transparent;border-top-color:#fff8e6;border-bottom:0}
.fl{position:absolute;z-index:7;font-weight:800;font-size:26px;color:var(--gold);text-shadow:0 2px 0 #000,0 0 10px #f5c451;pointer-events:none;transform:translate(-50%,-50%);animation:up 1s ease-out forwards;white-space:nowrap}
@keyframes up{to{transform:translate(-50%,-190%) scale(1.3);opacity:0}}
#toast{position:absolute;top:calc(env(safe-area-inset-top,0px) + 56px);left:50%;transform:translateX(-50%);z-index:8;background:#000b;border:1px solid var(--gold2);padding:7px 14px;border-radius:12px;font-weight:800;display:none;text-align:center;max-width:90vw;pointer-events:none}
</style>
<style>
:root{--gold:#ffb84d;--gold2:#6b7a3a;--panel:#1d2216}
.ov{background:radial-gradient(circle at 50% 15%,#5a3f1e,#1c1a10 55%,#0a0906),repeating-linear-gradient(45deg,#0000 0 14px,#ffffff06 14px 28px)}
h1{letter-spacing:1px;filter:drop-shadow(0 3px 0 #000) drop-shadow(0 0 12px #ff8a3d88)}
.btn{background:linear-gradient(#9aab52,#56642a);color:#10140a;border-color:#d4df86;box-shadow:0 6px 0 #2e3716,0 10px 20px #000a}
.btn.alt{background:linear-gradient(#3c4228,#20240f);color:#e6f0a8;border-color:#6b7a3a;box-shadow:0 6px 0 #0008}
.pill{background:linear-gradient(#2c3220,#14170d);border-color:#6b7a3a;color:#e6f0a8}
.wb{background:linear-gradient(#2c3220,#14170d);border-color:#4a5530}.wb.on{border-color:#ffb84d;box-shadow:0 0 14px #ffb84d99}
.card{background:#1d2216;border-color:#4a5530}.sub{color:#c4b98e}
#vg{position:fixed;inset:0;pointer-events:none;z-index:4}
</style></head>
